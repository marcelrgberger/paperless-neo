# Cleanup: Removes orphaned GHCR image tags (from deleted feature/fix branches) and
# untagged images. Runs weekly on Sundays at midnight UTC.
name: Cleanup Image Tags
on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'
concurrency:
  group: registry-tags-cleanup
  cancel-in-progress: false
jobs:
  cleanup-images:
    name: Cleanup Image Tags for ${{ matrix.primary-name }}
    if: github.repository_owner == 'marcelrgberger'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        primary-name: ["paperless-neo", "paperless-neo/cache"]
    env:
      TOKEN: ${{ secrets.GHA_CONTAINER_DELETE_TOKEN }}
    steps:
      - name: Clean temporary images
        if: "${{ env.TOKEN != '' }}"
        uses: stumpylog/image-cleaner-action/ephemeral@v0.12.0
        with:
          token: "${{ env.TOKEN }}"
          owner: "${{ github.repository_owner }}"
          is_org: "false"
          package_name: "${{ matrix.primary-name }}"
          scheme: "branch"
          repo_name: "paperless-neo"
          match_regex: "(feature|fix)"
          do_delete: "true"
  cleanup-untagged-images:
    name: Cleanup Untagged Images for ${{ matrix.primary-name }}
    if: github.repository_owner == 'marcelrgberger'
    runs-on: ubuntu-24.04
    needs:
      - cleanup-images
    strategy:
      fail-fast: false
      matrix:
        primary-name: ["paperless-neo", "paperless-neo/cache"]
    env:
      TOKEN: ${{ secrets.GHA_CONTAINER_DELETE_TOKEN }}
    steps:
      - name: Clean untagged images
        if: "${{ env.TOKEN != '' }}"
        uses: stumpylog/image-cleaner-action/untagged@v0.12.0
        with:
          token: "${{ env.TOKEN }}"
          owner: "${{ github.repository_owner }}"
          is_org: "false"
          package_name: "${{ matrix.primary-name }}"
          do_delete: "true"
