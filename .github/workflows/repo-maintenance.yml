# Repo Maintenance: Daily at 03:00 UTC. Marks stale issues/PRs (14 days) and locks
# inactive threads (30 days) to keep the issue tracker clean.
name: Repository Maintenance
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  issues: write
  pull-requests: write
  discussions: write
concurrency:
  group: lock
jobs:
  stale:
    name: Stale
    if: github.repository_owner == 'marcelrgberger'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/stale@v10.2.0
        with:
          days-before-stale: 14
          days-before-close: 14
          any-of-issue-labels: 'cant-reproduce,not a bug'
          stale-issue-label: stale
          stale-issue-message: >
            This issue has been automatically marked as stale because it has not had recent activity. It will be closed if no further activity occurs.
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-pr-message: ""
          stale-pr-label: stale
          exempt-pr-labels: 'notable'
          close-pr-message: >
            This pull request has been automatically closed because it has not had recent activity.
  lock-threads:
    name: Lock Old Threads
    if: github.repository_owner == 'marcelrgberger'
    runs-on: ubuntu-24.04
    steps:
      - uses: dessant/lock-threads@v6.0.0
        with:
          issue-inactive-days: '30'
          pr-inactive-days: '30'
          discussion-inactive-days: '30'
          log-output: true
