# PR Bot: Auto-labels new PRs by file path (labeler.yml), size, title prefix,
# and bot origin (dependabot, crowdin-bot).
name: PR Bot
on:
  pull_request_target:
    types: [opened]
jobs:
  pr-bot:
    name: Automated PR Bot
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Label PR by file path or branch name
        uses: actions/labeler@v6.0.1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Label by size
        uses: Gascon1/pr-size-labeler@v1.3.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          xs_label: 'small-change'
          xs_diff: '9'
          s_label: 'non-trivial'
          s_diff: '99999'
          fail_if_xl: 'false'
          excluded_files: /\.lock$/ /\.txt$/ ^src-ui/pnpm-lock\.yaml$ ^src-ui/messages\.xlf$ ^src/locale/en_US/LC_MESSAGES/django\.po$
      - name: Label by PR title
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title.toLowerCase();
            const labels = [];
            if (/^(fix|bugfix)/i.test(title)) {
              labels.push('bug');
            } else if (/^feature/i.test(title)) {
              labels.push('enhancement');
            } else if (!/^(dependabot)/i.test(title) && !/^(chore)/i.test(title)) {
              labels.push('enhancement');
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels,
              });
            }
      - name: Label bot-generated PRs
        if: ${{ contains(github.actor, 'dependabot') || contains(github.actor, 'crowdin-bot') }}
        uses: actions/github-script@v8.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            const user = pr.user.login.toLowerCase();
            const labels = [];
            if (user.includes('dependabot')) {
              labels.push('dependencies');
            }
            if (user.includes('crowdin-bot')) {
              labels.push('translation', 'skip-changelog');
            }
            if (labels.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels,
              });
            }
