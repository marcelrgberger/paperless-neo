name: Bug report
description: Something is not working
title: "[BUG] Concise description of the issue"
labels: ["bug", "unconfirmed"]
body:
  - type: markdown
    attributes:
      value: |
        ### Please remember: issues are for *bugs* only!
        That is, something you believe affects every single user of Paperless Neo, not just you. If you are not sure, start with a discussion instead.

        Note that **Paperless Neo does not perform OCR itself** — that is handled by Tesseract/OCRmyPDF. Problems with OCR should be raised upstream: https://github.com/ocrmypdf/OCRmyPDF/issues
  - type: markdown
    attributes:
      value: |
        #### Have a question? Start a [new discussion](https://github.com/marcelrgberger/paperless-neo/discussions/new).

        #### Before opening an issue, please check:

        - [Existing issues and discussions](https://github.com/marcelrgberger/paperless-neo/issues)
        - [Upstream troubleshooting docs](https://docs.paperless-ngx.com/troubleshooting/)
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is. If applicable, add screenshots to help explain your problem.
      placeholder: |
        Currently Paperless Neo does not work when...

        [Screenshot if applicable]
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Webserver logs
      description: Logs from the web server related to your issue.
      render: bash
    validations:
      required: true
  - type: textarea
    id: logs_browser
    attributes:
      label: Browser logs
      description: Logs from the web browser related to your issue, if needed
      render: bash
  - type: textarea
    id: logs_services
    attributes:
      label: Services logs
      description: Logs from other services (database, redis, etc.) related to your issue, if needed.
      render: bash
  - type: input
    id: version
    attributes:
      label: Paperless Neo version
      placeholder: e.g. 2.20.13
    validations:
      required: true
  - type: input
    id: host-os
    attributes:
      label: Host OS
      description: Host OS of the machine running Paperless Neo. Include architecture (uname -m) if applicable.
      placeholder: e.g. Ubuntu 24.04 / macOS 15 / Raspberry Pi arm64
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: Installation method
      options:
        - Docker
        - Bare metal
        - Other (please describe above)
    validations:
      required: true
  - type: textarea
    id: system-status
    attributes:
      label: System status
      description: If available, copy & paste the system status output from Settings > System Status > Copy
      render: json
  - type: input
    id: browser
    attributes:
      label: Browser
      description: Which browser you are using, if relevant.
      placeholder: e.g. Chrome, Safari, Firefox
  - type: textarea
    id: config-changes
    attributes:
      label: Configuration changes
      description: Any configuration changes you made in docker-compose.yml, .env or paperless.conf.
  - type: checkboxes
    id: required-checks
    attributes:
      label: Please confirm the following
      options:
        - label: I believe this issue is a bug that affects all users of Paperless Neo, not something specific to my installation.
          required: true
        - label: I have already searched for relevant existing issues and discussions before opening this report.
          required: true
        - label: I have updated the title field above with a concise description.
          required: true
