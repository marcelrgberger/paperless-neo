    <rect x="52" y="68" width="96" height="6" rx="3" fill="#0D1B2A" opacity="0.2"/>
    <rect x="52" y="86" width="76" height="6" rx="3" fill="#0D1B2A" opacity="0.2"/>
    <rect x="52" y="104" width="84" height="6" rx="3" fill="#0D1B2A" opacity="0.2"/>
    <rect x="40" y="130" width="120" height="2" rx="1" fill="#7EC8E3" opacity="0.6"/>
    <g transform="translate(100, 176)">
