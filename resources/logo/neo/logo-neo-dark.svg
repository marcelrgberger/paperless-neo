  <!-- Text: Neo (blue gradient) -->
  <text x="240" y="192" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="72" font-weight="700" fill="url(#textgrad)" letter-spacing="2">Neo</text>
