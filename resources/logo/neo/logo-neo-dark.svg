      <circle cx="0" cy="-24" r="5" fill="url(#glow)"/>
      <circle cx="32" cy="-12" r="5" fill="url(#glow)"/>
      <circle cx="0" cy="12" r="4" fill="url(#glow)"/>
      <line x1="-32" y1="-12" x2="0" y2="-24" stroke="#7EC8E3" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="-24" x2="32" y2="-12" stroke="#7EC8E3" stroke-width="2" stroke-linecap="round"/>
      <line x1="-32" y1="-12" x2="0" y2="12" stroke="#7EC8E3" stroke-width="2" stroke-linecap="round"/>
      <line x1="32" y1="-12" x2="0" y2="12" stroke="#7EC8E3" stroke-width="2" stroke-linecap="round"/>
