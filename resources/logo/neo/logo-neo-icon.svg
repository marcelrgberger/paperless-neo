<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F"/>
      <stop offset="100%" style="stop-color:#0D1B2A"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4DA8DA"/>
      <stop offset="100%" style="stop-color:#2E86C1"/>
    </linearGradient>
    <linearGradient id="fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E86C1"/>
      <stop offset="100%" style="stop-color:#1B4F72"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7EC8E3"/>
      <stop offset="100%" style="stop-color:#4DA8DA"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7EC8E3"/>
      <stop offset="50%" style="stop-color:#4DA8DA"/>
      <stop offset="100%" style="stop-color:#2E86C1"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Subtle outer glow ring -->
  <circle cx="256" cy="268" r="160" fill="none" stroke="url(#ring)" stroke-width="2" opacity="0.3"/>

  <!-- Document body -->
  <path d="M168 108 L328 108 L368 148 L368 404 L168 404 Z" fill="url(#doc)" opacity="0.95"/>

  <!-- Document fold -->
  <path d="M328 108 L328 148 L368 148 Z" fill="url(#fold)"/>

  <!-- Text lines on document -->
  <rect x="200" y="180" width="136" height="8" rx="4" fill="#0D1B2A" opacity="0.25"/>
  <rect x="200" y="204" width="108" height="8" rx="4" fill="#0D1B2A" opacity="0.25"/>
  <rect x="200" y="228" width="120" height="8" rx="4" fill="#0D1B2A" opacity="0.25"/>

  <!-- Neo circuit/AI element - stylized N -->
  <g transform="translate(256, 320)" opacity="0.9">
    <!-- Hexagonal nodes -->
    <circle cx="-40" cy="-16" r="6" fill="url(#glow)"/>
    <circle cx="0" cy="-32" r="6" fill="url(#glow)"/>
    <circle cx="40" cy="-16" r="6" fill="url(#glow)"/>
    <circle cx="0" cy="16" r="5" fill="url(#glow)"/>

    <!-- Connection lines -->
    <line x1="-40" y1="-16" x2="0" y2="-32" stroke="#7EC8E3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-32" x2="40" y2="-16" stroke="#7EC8E3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-40" y1="-16" x2="0" y2="16" stroke="#7EC8E3" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="40" y1="-16" x2="0" y2="16" stroke="#7EC8E3" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center pulse -->
    <circle cx="0" cy="-8" r="3" fill="#B8E6F5" opacity="0.8"/>
  </g>

  <!-- Scanning line effect -->
  <rect x="184" y="260" width="168" height="2" rx="1" fill="#7EC8E3" opacity="0.5"/>
</svg>
